<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="t d" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace">
<title id="t">How the setup is created</title><desc id="d">The wizard asks and reads only, shows a before/after plan, and writes files only after you approve.</desc>
<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#16305c" stroke-width="0.6"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7db3ff" stroke-width="1.5"/></marker><marker id="m-Haiku" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5fd07a" stroke-width="1.5"/></marker><marker id="m-Sonnet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#39c5cf" stroke-width="1.5"/></marker><marker id="m-Opus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bc8cff" stroke-width="1.5"/></marker><marker id="m-Fable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff7eb6" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="460" rx="12" fill="#0b1f3f"/><rect width="1000" height="460" rx="12" fill="url(#g)"/>
<rect x="395" y="20" width="210" height="36" fill="#0b1f3f" stroke="#7db3ff" stroke-width="1.4"/><text x="500" y="43" font-size="14" fill="#eaf2ff" font-weight="700" text-anchor="middle">/repo-mode:setup</text>
<path d="M500 56 V84" fill="none" stroke="#7db3ff" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="20" y="84" width="960" height="184" fill="none" stroke="#7db3ff" stroke-width="1" stroke-dasharray="3 5"/>
<text x="34" y="106" font-size="11" fill="#8fb0e0" font-weight="400" text-anchor="start">wizard · questions and reads only</text>
<rect x="40" y="122" width="168" height="130" fill="#0b1f3f" stroke="#7db3ff" stroke-width="1.4"/><text x="54" y="150" font-size="15" fill="#eaf2ff" font-weight="700" text-anchor="start">Check repo</text><text x="54" y="170" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">version</text><text x="54" y="189" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">settings</text>
<path d="M210 187 H226" fill="none" stroke="#7db3ff" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="228" y="122" width="168" height="130" fill="#0b1f3f" stroke="#7db3ff" stroke-width="1.4"/><text x="242" y="150" font-size="15" fill="#eaf2ff" font-weight="700" text-anchor="start">Round 1</text><text x="242" y="170" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">model · advisor</text><text x="242" y="189" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">agents · scope</text>
<path d="M398 187 H414" fill="none" stroke="#7db3ff" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="416" y="122" width="168" height="130" fill="#0b1f3f" stroke="#7db3ff" stroke-width="1.4"/><text x="430" y="150" font-size="15" fill="#eaf2ff" font-weight="700" text-anchor="start">Round 2</text><text x="430" y="170" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">model per agent</text><text x="430" y="189" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">+ the rest</text>
<path d="M586 187 H602" fill="none" stroke="#7db3ff" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="604" y="122" width="168" height="130" fill="#0b1f3f" stroke="#7db3ff" stroke-width="1.4"/><text x="618" y="150" font-size="15" fill="#eaf2ff" font-weight="700" text-anchor="start">Rounds 3–4</text><text x="618" y="170" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">effort · workflows</text><text x="618" y="189" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">rules · deny</text><text x="618" y="208" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">secrets · escalate</text><text x="618" y="227" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">test filter · LSP</text>
<path d="M774 187 H790" fill="none" stroke="#7db3ff" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="792" y="122" width="168" height="130" fill="#0b1f3f" stroke="#5fd07a" stroke-width="1.4"/><text x="806" y="150" font-size="15" fill="#eaf2ff" font-weight="700" text-anchor="start">Plan</text><text x="806" y="170" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">before / after</text><text x="806" y="189" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">of every file</text>
<path d="M500 268 V300" fill="none" stroke="#7db3ff" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M500 300 L582 346 L500 392 L418 346 z" fill="#0b1f3f" stroke="#ffb347" stroke-width="1.4"/>
<text x="500" y="351" font-size="13" fill="#eaf2ff" font-weight="700" text-anchor="middle">Approve?</text>
<path d="M584 346 H640" fill="none" stroke="#7db3ff" stroke-width="1.4" marker-end="url(#a)"/>
<text x="610" y="338" font-size="10.5" fill="#5fd07a" font-weight="700" text-anchor="middle">yes</text>
<rect x="640" y="290" width="340" height="112" fill="#0b1f3f" stroke="#5fd07a" stroke-width="1.4"/><text x="654" y="318" font-size="15" fill="#eaf2ff" font-weight="700" text-anchor="start">Writes</text><text x="654" y="338" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">settings.local.json · agents/*.md</text><text x="654" y="357" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">CLAUDE.local.md · hooks/ · .git/info/exclude</text><text x="654" y="376" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">repo-mode.json (state, for /off)</text>
<path d="M416 346 H360" fill="none" stroke="#7db3ff" stroke-width="1.4" marker-end="url(#a)"/>
<text x="390" y="338" font-size="10.5" fill="#8fb0e0" font-weight="700" text-anchor="middle">no</text>
<rect x="20" y="328" width="340" height="36" fill="#0b1f3f" stroke="#8fb0e0" stroke-width="1.2" stroke-dasharray="3 3"/><text x="190" y="351" font-size="13" fill="#8fb0e0" font-weight="700" text-anchor="middle">Nothing is written</text>
<text x="34" y="436" font-size="11" fill="#8fb0e0" font-weight="400" text-anchor="start">or change your answers → back to Round 1</text>
<text x="982" y="426" font-size="11" fill="#8fb0e0" font-weight="400" text-anchor="end">claude plugin marketplace add kniko/claude-plugins</text><text x="982" y="444" font-size="11" fill="#8fb0e0" font-weight="400" text-anchor="end">claude plugin install repo-mode@kniko-tools</text>
</svg>
