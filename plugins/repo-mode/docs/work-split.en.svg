<rect x="601" y="312" width="172" height="118" fill="#0b1f3f" stroke="#7db3ff" stroke-width="1.4"/><text x="615" y="340" font-size="15" fill="#eaf2ff" font-weight="700" text-anchor="start">general-purpose</text><circle cx="620" cy="357" r="4.2" fill="#39c5cf" stroke="#39c5cf" stroke-width="1.2"/><circle cx="633" cy="357" r="4.2" fill="#39c5cf" stroke="#39c5cf" stroke-width="1.2"/><circle cx="646" cy="357" r="4.2" fill="none" stroke="#39c5cf" stroke-width="1.2"/><circle cx="659" cy="357" r="4.2" fill="none" stroke="#39c5cf" stroke-width="1.2"/><text x="676" y="361" font-size="12" fill="#39c5cf" font-weight="700" text-anchor="start">Sonnet</text><text x="615" y="380" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">→ summary</text><text x="615" y="399" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">also runs Plan</text>
