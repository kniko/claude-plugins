<rect x="770" y="84" width="200" height="106" fill="#0b1f3f" stroke="#7db3ff" stroke-width="1.4"/><text x="784" y="112" font-size="16" fill="#eaf2ff" font-weight="700" text-anchor="start">advisor</text><circle cx="789" cy="129" r="4.2" fill="#bc8cff" stroke="#bc8cff" stroke-width="1.2"/><circle cx="802" cy="129" r="4.2" fill="#bc8cff" stroke="#bc8cff" stroke-width="1.2"/><circle cx="815" cy="129" r="4.2" fill="#bc8cff" stroke="#bc8cff" stroke-width="1.2"/><circle cx="828" cy="129" r="4.2" fill="none" stroke="#bc8cff" stroke-width="1.2"/><text x="845" y="133" font-size="12" fill="#bc8cff" font-weight="700" text-anchor="start">Opus 5.5</text><text x="784" y="152" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">reads the whole chat</text><text x="784" y="171" font-size="11.5" fill="#8fb0e0" font-weight="400" text-anchor="start">→ plan / correction</text>
