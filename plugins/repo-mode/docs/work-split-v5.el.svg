<title id="t">Πώς μοιράζεται η δουλειά</title><desc id="d">Το κύριο session αναθέτει σε subagents με δικό τους context, ρωτά τον advisor στα σημεία απόφασης και καλεί τον escalate μόνο αν απέτυχαν ο advisor και δύο προσπάθειες. Οι researcher και planner είναι προαιρετικοί.</desc>
